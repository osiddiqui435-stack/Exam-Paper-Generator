<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Exam Paper Generator</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- html2pdf.js for Client-Side PDF Export -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <link rel="stylesheet" href="style.css" />
</head>
<body class="bg-slate-100 font-sans text-slate-800 antialiased min-h-screen flex flex-col">

  <!-- Header / Navigation Bar -->
  <header class="bg-indigo-700 text-white shadow-md sticky top-0 z-30">
    <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center space-x-2">
        <i data-lucide="file-text" class="w-6 h-6 text-amber-300"></i>
        <h1 class="font-bold text-lg md:text-xl tracking-tight">Exam Paper Studio</h1>
      </div>

      <div class="flex items-center space-x-2">
        <button id="history-btn" class="flex items-center space-x-1 bg-indigo-600 hover:bg-indigo-500 text-white text-xs md:text-sm px-3 py-1.5 rounded-lg border border-indigo-400 transition">
          <i data-lucide="history" class="w-4 h-4"></i>
          <span class="hidden sm:inline">Recent Papers</span>
          <span id="history-count" class="bg-amber-400 text-slate-900 text-xs font-bold px-1.5 py-0.5 rounded-full">0</span>
        </button>

        <button id="export-pdf-btn" class="flex items-center space-x-1 bg-emerald-600 hover:bg-emerald-500 text-white text-xs md:text-sm px-3.5 py-1.5 rounded-lg font-semibold shadow-sm transition">
          <i data-lucide="download" class="w-4 h-4"></i>
          <span>Export PDF</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Mobile View Toggle Tabs (Visible only on mobile/tablet screens) -->
  <div class="lg:hidden bg-white border-b border-slate-200 sticky top-[53px] z-20 flex text-sm font-medium">
    <button id="tab-editor" class="flex-1 py-2.5 text-center text-indigo-600 border-b-2 border-indigo-600 font-semibold flex items-center justify-center space-x-1">
      <i data-lucide="edit-3" class="w-4 h-4"></i>
      <span>Paper Editor</span>
    </button>
    <button id="tab-preview" class="flex-1 py-2.5 text-center text-slate-500 hover:text-indigo-600 flex items-center justify-center space-x-1">
      <i data-lucide="eye" class="w-4 h-4"></i>
      <span>Live A4 Preview</span>
    </button>
  </div>

  <!-- Main Content Layout -->
  <main class="flex-1 max-w-7xl w-full mx-auto p-3 md:p-6 grid grid-cols-1 lg:grid-cols-12 gap-6">

    <!-- LEFT COLUMN: Editor Form Controls -->
    <section id="editor-container" class="lg:col-span-5 space-y-5">
      
      <!-- Preset Blueprints Bar -->
      <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-4">
        <label class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-2">Load Quick Presets</label>
        <div class="grid grid-cols-2 gap-2">
          <button onclick="loadPreset('chemistry12')" class="text-left text-xs bg-slate-50 hover:bg-indigo-50 border border-slate-200 hover:border-indigo-300 p-2 rounded-lg transition">
            <span class="font-bold block text-slate-700">Class 12 Chemistry</span>
            <span class="text-slate-400 text-[10px]">MCQ, Short, Long, Case</span>
          </button>
          <button onclick="loadPreset('primaryScience')" class="text-left text-xs bg-slate-50 hover:bg-indigo-50 border border-slate-200 hover:border-indigo-300 p-2 rounded-lg transition">
            <span class="font-bold block text-slate-700">Primary Science</span>
            <span class="text-slate-400 text-[10px]">MCQ, T/F, Blanks</span>
          </button>
        </div>
      </div>

      <!-- Paper Header Configuration -->
      <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-4 space-y-3">
        <h2 class="font-bold text-slate-700 text-sm flex items-center space-x-1.5 border-b pb-2">
          <i data-lucide="building" class="w-4 h-4 text-indigo-600"></i>
          <span>Paper Header Details</span>
        </h2>

        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">School / Institute Name</label>
          <input type="text" id="school-name" class="w-full text-sm border border-slate-300 rounded-lg p-2 focus:ring-2 focus:ring-indigo-500 outline-none" value="ST. XAVIER HIGHER SECONDARY SCHOOL" />
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">Class / Grade</label>
            <input type="text" id="class-name" class="w-full text-sm border border-slate-300 rounded-lg p-2 focus:ring-2 focus:ring-indigo-500 outline-none" value="Class 12th" />
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">Subject</label>
            <input type="text" id="subject-name" class="w-full text-sm border border-slate-300 rounded-lg p-2 focus:ring-2 focus:ring-indigo-500 outline-none" value="Chemistry" />
          </div>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">Time Allowed</label>
            <input type="text" id="time-allowed" class="w-full text-sm border border-slate-300 rounded-lg p-2 focus:ring-2 focus:ring-indigo-500 outline-none" value="3 Hours" />
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">Max Marks</label>
            <input type="number" id="max-marks" class="w-full text-sm border border-slate-300 rounded-lg p-2 focus:ring-2 focus:ring-indigo-500 outline-none" value="70" />
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">General Instructions (One per line)</label>
          <textarea id="instructions" rows="3" class="w-full text-xs border border-slate-300 rounded-lg p-2 focus:ring-2 focus:ring-indigo-500 outline-none">All questions are compulsory.
Section A carries 1 mark each.
Section B carries 2 marks each.
Section C carries 3 marks each.
Section D carries 5 marks each.</textarea>
        </div>
      </div>

      <!-- Question Builder Section -->
      <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-4 space-y-4">
        <div class="flex items-center justify-between border-b pb-2">
          <h2 class="font-bold text-slate-700 text-sm flex items-center space-x-1.5">
            <i data-lucide="list-plus" class="w-4 h-4 text-indigo-600"></i>
            <span>Questions List</span>
          </h2>
          <span id="calculated-total" class="text-xs font-semibold text-indigo-700 bg-indigo-50 px-2 py-1 rounded-md border border-indigo-200">Total: 0 Marks</span>
        </div>

        <!-- Dynamic Questions Container -->
        <div id="questions-container" class="space-y-4 max-h-[450px] overflow-y-auto pr-1"></div>

        <!-- Add Question Bar -->
        <div class="pt-2 flex gap-2">
          <select id="add-q-type" class="flex-1 text-xs border border-slate-300 rounded-lg p-2 outline-none">
            <option value="mcq">Multiple Choice Question (MCQ)</option>
            <option value="truefalse">True / False</option>
            <option value="fillblanks">Fill in the Blanks</option>
            <option value="short">Short Answer Question</option>
            <option value="long">Long Answer Question</option>
          </select>
          <button onclick="addQuestion()" class="bg-indigo-600 hover:bg-indigo-700 text-white text-xs px-3 py-2 rounded-lg font-semibold transition flex items-center space-x-1">
            <i data-lucide="plus" class="w-4 h-4"></i>
            <span>Add</span>
          </button>
        </div>

        <!-- Action Buttons Bar -->
        <div class="pt-3 border-t flex items-center justify-between gap-2">
          <button onclick="savePaperToLocalStorage()" class="flex-1 bg-slate-800 hover:bg-slate-900 text-white text-xs py-2 rounded-lg font-medium transition flex items-center justify-center space-x-1">
            <i data-lucide="save" class="w-3.5 h-3.5"></i>
            <span>Save Draft</span>
          </button>
          <button onclick="clearAllQuestions()" class="text-xs text-rose-600 hover:text-rose-800 font-medium px-2 py-2">
            Clear All
          </button>
        </div>
      </div>

    </section>

    <!-- RIGHT COLUMN: Live Paper A4 Preview -->
    <section id="preview-container" class="lg:col-span-7 hidden lg:block">
      <div class="bg-slate-200/70 p-3 md:p-6 rounded-xl border border-slate-300 shadow-inner flex flex-col items-center min-h-[700px] overflow-x-auto">
        
        <!-- Interactive Toolbar above A4 paper -->
        <div class="w-full max-w-[210mm] flex items-center justify-between mb-3 text-xs">
          <div class="flex items-center space-x-2 text-slate-600 font-medium">
            <i data-lucide="file-check" class="w-4 h-4 text-emerald-600"></i>
            <span>Live A4 Printable Sheet</span>
          </div>
          <label class="flex items-center space-x-2 cursor-pointer select-none bg-white px-2.5 py-1 rounded-md border text-slate-700 shadow-sm">
            <input type="checkbox" id="toggle-answers" onchange="renderPreview()" class="rounded text-indigo-600 focus:ring-0" />
            <span>Show Answers Key</span>
          </label>
        </div>

        <!-- Printable Document Canvas -->
        <div id="paper-preview" class="bg-white shadow-xl border border-slate-300 p-8 md:p-12 text-slate-900 w-full max-w-[210mm] min-h-[297mm] transition-all">
          <!-- Rendered dynamically by script.js -->
        </div>

      </div>
    </section>

  </main>

  <!-- LocalStorage History Modal Drawer -->
  <div id="history-modal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4">
    <div class="bg-white rounded-xl shadow-2xl max-w-lg w-full p-5 space-y-4">
      <div class="flex items-center justify-between border-b pb-3">
        <h3 class="font-bold text-slate-800 text-base flex items-center space-x-2">
          <i data-lucide="history" class="w-5 h-5 text-indigo-600"></i>
          <span>Saved Papers History (Last 5)</span>
        </h3>
        <button onclick="closeHistoryModal()" class="text-slate-400 hover:text-slate-600">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>

      <div id="history-list" class="space-y-2 max-h-[300px] overflow-y-auto">
        <!-- Rendered dynamically -->
      </div>

      <div class="pt-2 text-right">
        <button onclick="closeHistoryModal()" class="bg-slate-200 hover:bg-slate-300 text-slate-700 text-xs px-4 py-2 rounded-lg font-semibold">
          Close
        </button>
      </div>
    </div>
  </div>

  <!-- FOOTER PORTION -->
<footer class="app-footer">
  <p>Developed by <strong>Bodas Company</strong></p>
  <p>For support or feedback, contact us at: <a href="mailto:support@bodascompany.com">support@bodascompany.com</a></p>
  <p class="copyright">&copy; 2026 Bodas Company. All rights reserved.</p>
</footer>

<style>
  /* Footer CSS Styling */
  .app-footer {
    margin-top: 30px;
    padding: 15px 20px;
    background-color: #2c3e50;
    color: #ffffff;
    text-align: center;
    border-radius: 8px;
    font-size: 13px;
    line-height: 1.6;
  }
  .app-footer p {
    margin: 4px 0;
  }
  .app-footer a {
    color: #17a2b8;
    text-decoration: none;
    font-weight: bold;
  }
  .app-footer a:hover {
    text-decoration: underline;
  }
  .app-footer .copyright {
    font-size: 11px;
    color: #bdc3c7;
    margin-top: 8px;
  }
</style>

  <script src="script.js"></script>
</body>
</html>
